<script>
const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));

function showMsg(text,type='info'){
  const el=$('authMsg');
  el.textContent=text;
  el.className='msg show '+type;
}

async function req(url,opt={}){
  let r;
  try{
    r=await fetch(url,opt);
  }catch(e){
    throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.');
  }

  const j=await r.json().catch(()=>({}));

  if(!r.ok){
    throw new Error(j.error || ('Server error HTTP '+r.status));
  }

  return j;
}

function showAuth(){
  $('auth').style.display='block';
  $('dash').style.display='none';
}

function showDash(){
  $('auth').style.display='none';
  $('dash').style.display='block';
  loadReports();
}

/* =========================
   LOGIN
========================= */

async function login(){

  const email=$('email').value.trim();
  const password=$('pass').value;

  if(!email){
    showMsg('⚠️ Email wajib diisi.','err');
    $('email').focus();
    return;
  }

  if(!password){
    showMsg('⚠️ Password wajib diisi.','err');
    $('pass').focus();
    return;
  }

  const btn=document.querySelector('button[onclick="login()"]');

  btn.disabled=true;
  btn.textContent='⏳ MEMERIKSA...';

  showMsg('⏳ Sedang memeriksa email dan password...','info');

  try{

    const j=await req('/api/auth/login',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        email:email,
        password:password
      })
    });

    showMsg(
      '✅ LOGIN BERHASIL. Membuka dashboard admin...',
      'ok'
    );

    setTimeout(()=>{
      showDash();
    },500);

  }catch(e){

    showMsg(
      '❌ LOGIN GAGAL: '+e.message,
      'err'
    );

  }finally{

    btn.disabled=false;
    btn.textContent='LOGIN';

  }
}


/* =========================
   DAFTAR ADMIN
========================= */

async function register(){

  const email=$('email').value.trim();
  const password=$('pass').value;

  if(!email){
    showMsg('⚠️ Isi email terlebih dahulu.','err');
    $('email').focus();
    return;
  }

  if(!/^\S+@\S+\.\S+$/.test(email)){
    showMsg('⚠️ Format email belum benar.','err');
    $('email').focus();
    return;
  }

  if(password.length<8){
    showMsg('⚠️ Password minimal 8 karakter.','err');
    $('pass').focus();
    return;
  }

  const code=prompt(
    'Masukkan KODE PENDAFTARAN ADMIN dari pengelola server:'
  );

  if(!code){
    showMsg(
      'ℹ️ Pendaftaran dibatalkan karena kode tidak diisi.',
      'info'
    );
    return;
  }

  const btn=document.querySelector(
    'button[onclick="register()"]'
  );

  btn.disabled=true;
  btn.textContent='⏳ MENDAFTAR...';

  showMsg(
    '⏳ Sedang mendaftarkan akun admin...',
    'info'
  );

  try{

    const j=await req('/api/auth/register',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        email:email,
        password:password,
        code:code
      })
    });

    showMsg(
      '✅ '+(
        j.message ||
        'Admin berhasil didaftarkan. Silakan login.'
      ),
      'ok'
    );

    $('pass').value='';

  }catch(e){

    showMsg(
      '❌ PENDAFTARAN GAGAL: '+e.message,
      'err'
    );

  }finally{

    btn.disabled=false;
    btn.textContent='DAFTAR ADMIN';

  }
}


/* =========================
   LUPA PASSWORD
========================= */

async function resetReq(){

  const email=prompt(
    'Masukkan email admin:'
  );

  if(!email){
    return;
  }

  try{

    const j=await req(
      '/api/auth/reset-request',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          email:email
        })
      }
    );

    alert(
      '✅ '+(
        j.message ||
        'Permintaan reset password berhasil diproses.'
      )
    );

  }catch(e){

    alert(
      '❌ Gagal: '+e.message
    );

  }
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  try{
    await req('/api/auth/logout',{
      method:'POST'
    });
  }catch(e){}

  showAuth();

  showMsg(
    '✅ Anda sudah logout.',
    'ok'
  );
}


/* =========================
   CEK SESSION
========================= */

async function check(){

  try{

    await req('/api/auth/me');

    showDash();

  }catch(e){

    showAuth();

  }
}


/* =========================
   DUTY
========================= */

async function setDuty(duty){

  try{

    await req('/api/duty',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        duty:duty
      })
    });

    loadReports();

  }catch(e){

    alert(
      '❌ '+e.message
    );

  }
}


/* =========================
   STATUS
========================= */

function statusClass(s){

  return s==='Belum Dikerjakan'
    ?'s1'
    :s==='Sedang Dikerjakan'
    ?'s2'
    :s==='Selesai'
    ?'s3'
    :'s4';

}


/* =========================
   UPDATE
========================= */

async function update(id,field,value){

  try{

    await req(
      '/api/reports/'+encodeURIComponent(id),
      {
        method:'PATCH',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          [field]:value
        })
      }
    );

    loadReports();

  }catch(e){

    alert(
      '❌ '+e.message
    );

  }
}


/* =========================
   DELETE
========================= */

async function del(id){

  if(!confirm(
    'Hapus laporan ini beserta file fotonya?'
  )) return;

  try{

    await req(
      '/api/reports/'+encodeURIComponent(id),
      {
        method:'DELETE'
      }
    );

    loadReports();

  }catch(e){

    alert(
      '❌ '+e.message
    );

  }
}


/* =========================
   FOTO AFTER
========================= */

async function afterPhoto(id){

  const inp=document.createElement('input');

  inp.type='file';
  inp.accept='image/*';

  inp.onchange=async()=>{

    if(!inp.files[0]) return;

    const fd=new FormData();

    fd.append(
      'image',
      inp.files[0]
    );

    try{

      await req(
        '/api/reports/'+encodeURIComponent(id)+'/after',
        {
          method:'POST',
          body:fd
        }
      );

      alert(
        '✅ Foto AFTER tersimpan.'
      );

      loadReports();

    }catch(e){

      alert(
        '❌ '+e.message
      );

    }

  };

  inp.click();

}


/* =========================
   LOAD REPORTS
========================= */

async function loadReports(){

  try{

    const j=await req(
      '/api/reports'
    );

    const r=j.reports||[];

    $('total').textContent=r.length;

    $('belum').textContent=
      r.filter(x=>
        x.status==='Belum Dikerjakan'
      ).length;

    $('proses').textContent=
      r.filter(x=>
        x.status==='Sedang Dikerjakan'
      ).length;

    $('selesai').textContent=
      r.filter(x=>
        x.status==='Selesai'
      ).length;

    const cfg=await req(
      '/api/config'
    );

    $('dutyNow').textContent=
      String(cfg.duty).toUpperCase();

    $('rows').innerHTML=r.map(x=>`

<tr>

<td>
<b>${esc(x.id)}</b>
<br>
${new Date(x.created_at).toLocaleString('id-ID')}
</td>

<td>

<b>${esc(x.location)}</b>

${x.room
 ?'<br>Nomor: '+esc(x.room)
 :''
}

<br>

${esc(x.category)}

<br>

<b>${esc(x.priority)}</b>

<p>
${esc(x.description)}
</p>

<small>
Pelapor: ${esc(x.reporter)}
</small>

</td>

<td>

<a
href="${esc(x.image_url)}"
target="_blank"
>

<img
class="thumb"
src="${esc(x.image_url)}"
>

</a>

${
x.after_image_url
?
'<br><a href="'+
esc(x.after_image_url)+
'" target="_blank">Foto AFTER</a>'
:''
}

</td>

<td>

<select
onchange="update(
'${esc(x.id)}',
'status',
this.value
)"
>

<option
${x.status==='Belum Dikerjakan'
?'selected':''}
>
Belum Dikerjakan
</option>

<option
${x.status==='Sedang Dikerjakan'
?'selected':''}
>
Sedang Dikerjakan
</option>

<option
${x.status==='Selesai'
?'selected':''}
>
Selesai
</option>

<option
${x.status==='Arsip'
?'selected':''}
>
Arsip
</option>

</select>

<br>

<span
class="pill ${statusClass(x.status)}"
>
${esc(x.status)}
</span>

</td>

<td>

${esc(x.duty||'-')}

<br>

<select
onchange="update(
'${esc(x.id)}',
'duty',
this.value
)"
>

<option value="">
Pilih
</option>

<option
${x.duty==='Handoko'
?'selected':''}
>
Handoko
</option>

<option
${x.duty==='Mustangin'
?'selected':''}
>
Mustangin
</option>

</select>

</td>

<td>

<button
class="btn blue"
onclick="afterPhoto('${esc(x.id)}')"
>
📷 AFTER
</button>

<button
class="btn red"
style="margin-top:6px"
onclick="del('${esc(x.id)}')"
>
HAPUS
</button>

</td>

</tr>

`).join('');

  }catch(e){

    if(
      e.message==='Unauthorized'
    ){

      showAuth();

    }else{

      alert(
        '❌ Gagal mengambil laporan: '+
        e.message
      );

    }

  }

}


/* =========================
   RESET PASSWORD TOKEN
========================= */

const token=
new URLSearchParams(
  location.search
).get('reset');

if(token){

  const np=prompt(
    'Masukkan password baru minimal 8 karakter:'
  );

  if(np){

    req(
      '/api/auth/reset',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          token:token,
          password:np
        })
      }
    )
    .then(j=>{

      alert(
        '✅ '+
        (j.message||
        'Password berhasil diubah. Silakan login.')
      );

    })
    .catch(e=>{

      alert(
        '❌ '+e.message
      );

    });

  }

}


/* MULAI */

check();

</script>
